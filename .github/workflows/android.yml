name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Fails in seconds on bad educational content, before any Gradle work starts.
  # The same validator also runs inside the Gradle build (preBuild -> buildContentDb),
  # so it cannot be bypassed — this job just surfaces the failure fast and clearly.
  # ---------------------------------------------------------------------------
  content:
    name: Validate content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate educational content
        working-directory: content
        run: python3 tools/validate.py

  lint:
    name: Lint
    needs: content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Android Lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          retention-days: 14

  test:
    name: Unit tests
    needs: content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Only builds once lint and tests are green.
  # ---------------------------------------------------------------------------
  build:
    name: Build APK
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Signing material is never committed. If the four secrets are present the
      # release APK is signed; otherwise the build still succeeds and produces
      # app-release-unsigned.apk, so forks and PRs are not blocked.
      - name: Configure signing (optional)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release signing configured."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets set - release APK will be unsigned."
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APKs were produced
        run: |
          set -e
          shopt -s nullglob
          debug=(app/build/outputs/apk/debug/*.apk)
          release=(app/build/outputs/apk/release/*.apk)
          if [ ${#debug[@]} -eq 0 ]; then echo "::error::No debug APK produced"; exit 1; fi
          if [ ${#release[@]} -eq 0 ]; then echo "::error::No release APK produced"; exit 1; fi
          echo "### APKs built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| APK | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in "${debug[@]}" "${release[@]}"; do
            size=$(du -h "$f" | cut -f1)
            echo "| \`$(basename "$f")\` | $size |" >> "$GITHUB_STEP_SUMMARY"
            echo "built $f ($size)"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Release signed: ${{ steps.signing.outputs.signed }}" >> "$GITHUB_STEP_SUMMARY"

      # Proves the release APK is a well-formed, installable package rather than
      # just a file that happens to exist.
      - name: Inspect release APK
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|application-label:" || true
          echo "--- permissions ---"
          "$BT/aapt2" dump permissions "$APK" || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KoreanSamjho-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: KoreanSamjho-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
